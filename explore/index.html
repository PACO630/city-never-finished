<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 文字（網站作者可直接改這裡） ---------- */
const TEXT = {
  now: { title:'現在｜2026',
    change:'大片鐵皮屋頂，北臨孟子路、東臨自由三路，臨路一圈是店面；西側是停車場，後面是微笑公園，中間有圍籬隔開。',
    need:'—', who:'—',
    q:'先記住現在的樣子：哪些東西，是你覺得市場不能沒有的？' },
  A: { title:'A｜局部調整',
    change:'屋頂換新、棚布統一、地面重鋪。格局不變，市場還是原本的市場。',
    need:'攤商願意分攤維修費，管理單位持續維護。',
    who:'攤商、市場管理單位。',
    q:'什麼被保住了？變乾淨之後，還是你熟悉的那個市場嗎？' },
  B: { title:'B｜活動重組',
    change:'鐵皮屋頂拆除，換成一整片紅色鋼拱（參考三鳳中街），五道拱廊並排，長短不一地伸進微笑公園；圍籬拆掉，市場一路長進公園。攤位變成可移動的推車，停車場縮小一半，變成種樹的廣場。',
    need:'攤商同意搬位、公部門出資、周邊住戶接受更多人潮。',
    who:'被移位的老攤商、停車的人、周邊住戶。',
    q:'整個打開了。但誰需要重新適應？誰的位置不見了？' },
  C: { title:'C｜暫緩變動',
    change:'形體幾乎沒變，但屋頂更鏽、鐵捲門拉下的更多，人也變少了。',
    need:'現有結構還撐得住。',
    who:'未來的使用者——等越久，修越貴。',
    q:'東西都還在，生活卻變少了。不改變，也是一種選擇嗎？' }
};

/* ---------- 基本設定 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(30, 4/3, 1, 1000);
camera.position.set(95, 88, -95);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-6, 0, 6);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.45;
controls.minDistance = 50; controls.maxDistance = 260;
controls.enablePan = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(60, 120, -20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-110, right:110, top:110, bottom:-110, near:1, far:400 });
sun.target.position.set(-6, 0, 6); scene.add(sun, sun.target);

/* ---------- 工具 ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const reseed = s => { seed = s; };
const EDGE = new THREE.LineBasicMaterial({ color:0x111111, transparent:true, opacity:.7 });
const EDGE_RED = new THREE.LineBasicMaterial({ color:0xCF3F2B });
const RED = 0xCF3F2B;
const mats = {};
// 網站語言：白／灰線稿，只有「改變」用紅色
const mono = c => { if (c === RED || c === 0xCF3F2B) return 0xCF3F2B;
  if (c === 0x3F6B4A) return 0xc9d9c6;   // 草地：淺綠
  if (c === 0x7fa66a) return 0x8fb294;   // 樹冠：灰綠
  const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255, l = (0.3*r + 0.59*g + 0.11*b) / 255;
  const v = Math.round(150 + l * 105); return (v << 16) | (v << 8) | v; };
const M = (c, o={}) => { const k = c + JSON.stringify(o); return mats[k] ||= new THREE.MeshLambertMaterial({ color:mono(c), ...o }); };


function box(parent, w, h, d, color, x, y, z, { edges=true, shadow=true, ry=0, rx=0, mat=null, red=false } = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat || M(color));
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0);
  m.castShadow = shadow; m.receiveShadow = true;
  if (edges || red) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), red ? EDGE_RED : EDGE));
  parent.add(m); return m;
}
function canvasTex(draw, w=128, h=128, rep=[1,1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
const corrugated = (base, rust, rustAmt, rep) => new THREE.MeshLambertMaterial({ map: canvasTex((g,w,h) => {
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i=0;i<w;i+=8){ g.fillStyle='rgba(0,0,0,.10)'; g.fillRect(i,0,3,h); }
  reseed(rustAmt*100+3);
  for (let i=0;i<rustAmt*22;i++){ g.fillStyle=rust; g.globalAlpha=.15+rnd()*.25;
    g.beginPath(); g.ellipse(rnd()*w, rnd()*h, 4+rnd()*14, 3+rnd()*8, 0, 0, 7); g.fill(); }
  g.globalAlpha=1;
}, 128, 128, rep) });
const shutterMat = new THREE.MeshLambertMaterial({ map: canvasTex((g,w,h)=>{
  g.fillStyle='#e6e6e6'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=6){ g.fillStyle='#9a9a9a'; g.fillRect(0,y,w,1.5); }
}, 64, 64, [1,1]) });

/* ---------- 人、機車、汽車、樹 ---------- */
const SHIRT = [0xe7b84a, 0x3f6fb5, 0xd06a4c, 0x6a9a62, 0xeeeeee, 0x8a5aa8, 0x333333, 0xc9a27c];
function person(parent, x, z, { sit=false, color } = {}) {
  const p = new THREE.Group();
  const c = color ?? SHIRT[Math.floor(rnd()*SHIRT.length)];
  const h = sit ? 0.5 : 0.85;
  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.14,h,8), M(0x3a3a44)); legs.position.y = h/2 + (sit ? .45 : 0);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,.65,8), M(c)); body.position.y = h + .33 + (sit ? .45 : 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.15,10,8), M(0xe2b996)); head.position.y = h + .82 + (sit ? .45 : 0);
  [legs, body, head].forEach(m => { m.castShadow = true; p.add(m); });
  if (sit) box(p, .9, .45, .45, 0x8a6a4a, 0, .22, 0, { edges:false });
  p.position.set(x, 0.05, z); p.rotation.y = rnd()*6.28; parent.add(p); return p;
}
const SCOOTER = [0xcc3333, 0xeeeeee, 0x333333, 0x4a7fc0, 0xe0c040, 0x7bb08a];
function scooter(parent, x, z, ry=0) {
  const s = new THREE.Group();
  box(s, .45, .5, 1.6, SCOOTER[Math.floor(rnd()*SCOOTER.length)], 0, .5, 0, { edges:false });
  box(s, .35, .2, .6, 0x222222, 0, .85, -.2, { edges:false });
  box(s, .5, .1, .1, 0x222222, 0, 1.1, .7, { edges:false });
  s.position.set(x, 0, z); s.rotation.y = ry; parent.add(s);
}
function car(parent, x, z, color, ry=0) {
  const c = new THREE.Group();
  box(c, 1.8, .8, 4.2, color, 0, .55, 0);
  box(c, 1.6, .6, 2.2, 0x9fb3c0, 0, 1.25, -.2);
  c.position.set(x, 0, z); c.rotation.y = ry; parent.add(c);
}
function tree(parent, x, z, s=1) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.22*s,2.4*s,7), M(0x7a5a3c)); trunk.position.y = 1.2*s;
  const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9*s, 0), M(0x7fa66a, { flatShading:true })); crown.position.y = 3.6*s;
  [trunk, crown].forEach(m => { m.castShadow = true; t.add(m); });
  t.position.set(x, 0, z); parent.add(t);
}

/* ---------- 不變的部分（共用）：依自由黃昏市場實際配置簡化 ----------
   座標：X 向東、Z 向南（公尺）。市場長邊沿自由三路（南北向），
   北臨孟子路、東臨自由三路；西側是停車場，南側／西南是微笑公園；對街是透天老屋。 */
const shared = new THREE.Group(); scene.add(shared);
box(shared, 170, .1, 150, 0xd9d9d9, -5, -.05, 5, { edges:false });               // 地面
// 道路：孟子路（北）、自由三路（東）
box(shared, 170, .06, 10, 0x9a9a9a, -5, .03, -45, { edges:false });
box(shared, 10, .06, 150, 0x9a9a9a, 25, .03, 5, { edges:false });
for (let x=-85; x<80; x+=7) box(shared, 3.5, .02, .25, 0xffffff, x, .07, -45, { edges:false });
for (let z=-40; z<80; z+=7) box(shared, .25, .02, 3.5, 0xffffff, 25, .07, z, { edges:false });
// 人行道
box(shared, 2.5, .15, 112, 0xcfcfcf, 18.75, .07, 0, { edges:false });
box(shared, 100, .15, 2.5, 0xcfcfcf, -30, .07, -38.75, { edges:false });

// 微笑公園（南側＋西南）：草地、環形步道、樹
const GRASS = 0x3F6B4A;   // 只有自然用綠色（網站的 --memory 色）
box(shared, 88, .08, 40, GRASS, -26, .04, 58, { edges:false });
box(shared, 50, .08, 30, GRASS, -45, .04, 26, { edges:false });
const ring = new THREE.Mesh(new THREE.RingGeometry(7, 8.6, 40), M(0xe6e6e6)); ring.rotation.x = -Math.PI/2; ring.position.set(-48, .1, 30); shared.add(ring);
const plaza = new THREE.Mesh(new THREE.CircleGeometry(3, 30), M(0xe6e6e6)); plaza.rotation.x = -Math.PI/2; plaza.position.set(-48, .1, 30); shared.add(plaza);
box(shared, 1.6, .1, 40, 0xe6e6e6, -34, .1, 50, { edges:false, ry:.6 });
box(shared, 60, .1, 1.6, 0xe6e6e6, -20, .1, 46, { edges:false, ry:-.15 });
reseed(21);
for (let i=0;i<46;i++) {
  const x = -68 + rnd()*84, z = 14 + rnd()*62;
  if (z < 38 && x > -16) continue;                 // 不種在市場上
  if (x > -15 && x < 21 && z < 66) continue;          // 留給 B 情境的拱廊（其他情境是草地）
  if (Math.hypot(x+48, z-30) < 10) continue;       // 留出圓形廣場
  tree(shared, x, z, .8 + rnd()*.6);
}

// 對街的透天老屋（四個畫面都不變）
const HOUSE = [0xf2f2f2, 0xe2e2e2, 0xebebeb, 0xd8d8d8];
reseed(11);
function townhouse(x, z, ry, i) {
  const floors = 3 + Math.floor(rnd()*3), hh = floors*3.2, h = new THREE.Group();
  box(h, 4, hh, 14, HOUSE[i%4], 0, hh/2, 0);
  for (let f=1; f<floors; f++) {
    box(h, 2.6, 1.3, .12, 0x777777, 0, f*3.2+1.6, -7.05, { edges:false });
    for (let k=-1.2;k<=1.2;k+=.4) box(h, .04, 1.4, .04, 0x333333, k, f*3.2+1.6, -7.15, { edges:false, shadow:false });
  }
  box(h, 3.2, 2.4, .1, 0xaaaaaa, 0, 1.2, -7.05, { edges:false, mat:shutterMat });
  h.position.set(x, 0, z); h.rotation.y = ry; shared.add(h);
}
for (let i=0;i<16;i++) townhouse(39, -36 + i*4.2, -Math.PI/2, i);   // 自由三路對面，面向西
for (let i=0;i<14;i++) townhouse(-52 + i*4.2, -59, 0, i+3);          // 孟子路對面，面向南
reseed(5);
for (let i=0;i<12;i++) scooter(shared, 20.3 + (i%2)*.9, -30 + i*5.5, Math.PI/2);  // 騎樓前機車

/* ---------- 市場：依情境產生 ---------- */
const MK = { x0:-12, x1:18, z0:-36, z1:36 };                       // 市場量體 30 × 72
const STALL_Z = [...Array(14)].map((_,i) => -31 + i*5);            // 每排 14 攤
const ROWS = [{ x:-9, face:1 }, { x:-1.6, face:-1 }, { x:1.6, face:1 }, { x:9, face:-1 }];   // 兩條南北向走道
const AISLES = [-5.3, 5.3];
const TARP = [0xCF3F2B, 0xf0f0f0, 0xbdbdbd, 0xf0f0f0, 0x9a9a9a];
const GOODS = [0xdddddd, 0xbbbbbb, 0x999999, 0xffffff];

function stall(parent, x, z, face, tarpColor, changed) {
  const s = new THREE.Group();
  box(s, 3.4, .9, 1.4, 0xf2f2f2, 0, .45, 0);
  reseed(Math.round(x*13 + z*7 + 999));
  for (let i=0;i<4;i++) box(s, .6, .25 + rnd()*.2, .5, GOODS[Math.floor(rnd()*GOODS.length)], -1.2 + i*.8, 1.05, (rnd()-.5)*.4, { edges:false });
  box(s, 3.8, .05, 2.6, tarpColor, 0, 2.5, .3, { rx: 0.18, red: changed });
  box(s, .06, 2.5, .06, 0x777777, -1.8, 1.25, 1.4, { edges:false });
  box(s, .06, 2.5, .06, 0x777777,  1.8, 1.25, 1.4, { edges:false });
  s.position.set(x, 0, z); s.rotation.y = face > 0 ? Math.PI/2 : -Math.PI/2; parent.add(s);
}
function shutterStall(parent, x, z, face, changed) {
  const s = new THREE.Group();
  box(s, 3.8, 2.6, 2.2, 0xb4b6b3, 0, 1.3, -.2, { mat: shutterMat, red: changed });
  s.position.set(x, 0, z); s.rotation.y = face > 0 ? Math.PI/2 : -Math.PI/2; parent.add(s);
}
function cart(parent, x, z, color) {
  const c = new THREE.Group();
  box(c, 2, .9, 1.1, 0xe8e8e8, 0, .65, 0);
  for (const dx of [-.8,.8]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.1,12), M(0x333333)); w.rotation.x = Math.PI/2; w.position.set(dx,.22,.6); c.add(w); }
  box(c, 2.3, .05, 1.6, color, 0, 2.3, 0);
  box(c, .05, 1.4, .05, 0x777777, 0, 1.6, 0, { edges:false });
  c.position.set(x, 0, z); c.rotation.y = rnd()*6.28; parent.add(c);
}
// 大片低斜屋頂（屋脊南北向）
function bigRoof(parent, mat, changed) {
  const W = MK.x1 - MK.x0 + 2, L = MK.z1 - MK.z0 + 2, eave = 5.2, rise = 1.8;
  const cx = (MK.x0 + MK.x1)/2, cz = (MK.z0 + MK.z1)/2, half = W/2, slope = Math.hypot(half, rise), ang = Math.atan2(rise, half);
  for (const side of [-1, 1]) {
    const g = new THREE.BoxGeometry(slope + .4, .14, L);
    const m = new THREE.Mesh(g, changed ? M(0xf7f7f7) : mat);
    m.position.set(cx + side*half/2, eave + rise/2, cz); m.rotation.z = -side*ang; m.castShadow = true;
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), changed ? EDGE_RED : EDGE)); parent.add(m);
  }
  for (let z = MK.z0; z <= MK.z1; z += 6) for (const x of [MK.x0, MK.x1]) box(parent, .3, eave, .3, 0x666666, x, eave/2, z, { edges:false });
  // 臨路兩側的店面雨遮（自由三路、孟子路）
  for (let z = MK.z0 + 2; z < MK.z1; z += 4) box(parent, 2.2, .06, 3.8, changed ? 0xf7f7f7 : 0xdddddd, MK.x1 + 1.1, 3.2, z, { red: changed });
  for (let x = MK.x0 + 2; x < MK.x1; x += 4) box(parent, 3.8, .06, 2.2, changed ? 0xf7f7f7 : 0xdddddd, x, 3.2, MK.z0 - 1.1, { red: changed });
}

function buildState(k) {
  const g = new THREE.Group();
  reseed({ now:1, A:2, B:3, C:4 }[k]);

  // 市場地坪
  box(g, MK.x1-MK.x0, .06, MK.z1-MK.z0, k==='A' ? 0xf2f2f2 : k==='B' ? 0xeeeeee : 0xbdbdbd, (MK.x0+MK.x1)/2, .06, (MK.z0+MK.z1)/2, { edges:false, red: k==='A' });

  // 屋頂
  if (k === 'now') bigRoof(g, corrugated('#ececec', '#777777', 0.5, [3,12]));
  if (k === 'A')   bigRoof(g, null, true);
  if (k === 'C')   bigRoof(g, corrugated('#dedede', '#555555', 2.0, [3,12]));
  if (k === 'B') {   // 屋頂拆除，換成一整片紅色鋼拱（參考三鳳中街）：五跨並排，往公園伸出長短不一的「手指」
    const BAYS = 5, SPAN = 6.8, R = SPAN/2, SPRING = 3.6, X0 = -14;
    const ENDS = [44, 58, 50, 64, 40];                 // 每一跨往南伸進公園的長度不同
    const archG = new THREE.TorusGeometry(R, .06, 6, 24, Math.PI);
    const ribMat = M(RED);
    const skin = new THREE.MeshLambertMaterial({ color:0xCF3F2B, transparent:true, opacity:.07, side:THREE.DoubleSide, depthWrite:false });
    for (let b = 0; b < BAYS; b++) {
      const xc = X0 + R + b*SPAN, z0 = MK.z0 - 2, z1 = ENDS[b], L = z1 - z0;
      for (let z = z0; z <= z1 + .01; z += 3) {
        const arch = new THREE.Mesh(archG, ribMat); arch.position.set(xc, SPRING, z); g.add(arch);
        for (const sd of [-1, 1]) box(g, .12, SPRING, .12, RED, xc + sd*R, SPRING/2, z, { edges:false, shadow:false });
      }
      // 縱向繫桿：拱頂與兩側起拱線
      box(g, .08, .08, L, RED, xc, SPRING + R, (z0 + z1)/2, { edges:false, shadow:false });
      for (const sd of [-1, 1]) box(g, .08, .08, L, RED, xc + sd*R, SPRING, (z0 + z1)/2, { edges:false, shadow:false });
      // 半透明的屋面
      const roof = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L, 24, 1, true, -Math.PI/2, Math.PI), skin);
      roof.rotation.x = Math.PI/2; roof.rotation.y = Math.PI/2; roof.position.set(xc, SPRING, (z0 + z1)/2); g.add(roof);
    }
  }
  // 攤位
  const closedNow = [5, 20, 33, 47];
  const closed = { now:closedNow, A:[20], C:closedNow.concat([2,9,12,17,24,28,30,38,41,44,50,53]), B:[] }[k];
  let idx = 0;
  if (k !== 'B') {
    ROWS.forEach(r => STALL_Z.forEach(z => {
      const isClosed = closed.includes(idx), newly = k === 'C' && isClosed && !closedNow.includes(idx);
      if (isClosed) shutterStall(g, r.x, z, r.face, newly);
      else stall(g, r.x, z, r.face, k === 'A' ? 0xf0f0f0 : TARP[(idx*3) % TARP.length], k === 'A');
      idx++;
    }));
  } else {
    for (let i=0;i<46;i++) {                         // 攤車沿著拱下排開，一路延伸進公園
      const bay = i % 5, xc = -14 + 3.4 + bay*6.8 + (rnd()-.5)*2.2;
      const zMax = [44, 58, 50, 64, 40][bay];
      cart(g, xc, MK.z0 + 2 + rnd()*(zMax - MK.z0 - 4), i%3 ? RED : 0xf0f0f0);
    }
  }

  // 市場與公園之間的邊界（B 打開）
  if (k !== 'B') {
    box(g, MK.x1 - MK.x0 + 30, 1.8, .25, 0xe0e0e0, (MK.x0 + MK.x1)/2 - 15, .9, 37.5);
    box(g, .25, 1.8, 26, 0xe0e0e0, -16, .9, 24.5);
  } else {
    box(g, MK.x1 - MK.x0 + 30, .03, .5, RED, (MK.x0 + MK.x1)/2 - 15, .1, 37.5, { edges:false });
    box(g, .5, .03, 26, RED, -16, .1, 24.5, { edges:false });
  }

  // 西側停車場（B 縮小成廣場）
  const P = { x0:-62, x1:-16, z0:-37, z1:11 };
  if (k !== 'B') {
    box(g, P.x1-P.x0, .05, P.z1-P.z0, 0xa8a8a8, (P.x0+P.x1)/2, .05, (P.z0+P.z1)/2, { edges:false });
    for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) {
      if (k === 'C' && (r*9 + c) % 3 === 0) continue;
      if (rnd() < .25) continue;
      car(g, P.x0 + 3 + c*4.9, P.z0 + 5 + r*9.5, [0xf5f5f5, 0x666666, 0xcccccc, 0x222222][(r+c)%4], 0);
    }
  } else {
    box(g, P.x1-P.x0, .05, 16, 0xa8a8a8, (P.x0+P.x1)/2, .05, P.z0 + 8, { edges:false });
    for (let c = 0; c < 8; c++) car(g, P.x0 + 4 + c*5.2, P.z0 + 6, [0xf5f5f5, 0x666666, 0xcccccc][c%3], 0);
    box(g, P.x1-P.x0, .05, P.z1-P.z0-16, 0xeeeeee, (P.x0+P.x1)/2, .06, (P.z0+16+P.z1)/2, { edges:false, red:true });
    for (let i=0;i<10;i++) tree(g, P.x0 + 4 + (i%5)*9, P.z0 + 22 + Math.floor(i/5)*12, .8);
  }

  // 人
  const crowd = { now:60, A:62, B:120, C:14 }[k];
  for (let i=0;i<crowd;i++) {
    if (k === 'B' && i > 75) person(g, -40 + rnd()*24, 16 + rnd()*30, { sit: i%2===0 });
    else if (k === 'B') person(g, -13 + rnd()*33, MK.z0 + 1 + rnd()*96);
    else if (i % 6 === 0) person(g, 19 + rnd()*1.5, MK.z0 + rnd()*72);                   // 騎樓
    else person(g, AISLES[i%2] + (rnd()-.5)*2.4, MK.z0 + 2 + rnd()*68);                   // 走道
  }
  return g;
}

const states = {};
for (const k of ['now','A','B','C']) { states[k] = buildState(k); states[k].visible = k === 'now'; scene.add(states[k]); }

/* ---------- 切換 ---------- */
function show(k) {
  for (const s in states) states[s].visible = s === k;
  const t = TEXT[k];
  document.getElementById('p-title').textContent = t.title;
  document.getElementById('p-change').textContent = t.change;
  document.getElementById('p-need').textContent = t.need;
  document.getElementById('p-who').textContent = t.who;
  document.getElementById('p-q').textContent = t.q;
  document.querySelectorAll('#btns button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
document.getElementById('btns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
show('now');

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
